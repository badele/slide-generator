# Configuration des tests pour le profil bottom_right_title_square (basé sur README.md)
tests:
  - name: exemple garage vim
    description: Test with VIM garage theme
    command_args:
      - --set IMG1="https://raw.githubusercontent.com/badele/vide/main/doc/img/plug_dashboard.png"
      - --set IMG1_EFFECTS_AFTER="-colorspace Gray  -dither FloydSteinberg -colors 32 +level-colors '#004466,#4cff88' -resize 1200x675"
      - --set COMMAND2="-fill '#00ff55' -draw 'rectangle 885,571 900,675'"
      - --set TEXT4="Le"
      - --set TEXT4_FG="#000000"
      - --set TEXT5="Garage"
      - --set TEXT5_FG="#000000"
      - --set TEXT6="VIM"
      - --set TEXT6_FG="#FFD300"
      - --set TEXT6_FONT_SIZE=128
      - --set TEXT6_GEOMETRY="+40+200"
      - --set TEXT7="Try it, you'll love it!"
      - --set TEXT7_FG="#FFFFFF"
      - --set TEXT7_FONT_SIZE=64
      - --set TEXT7_GEOMETRY="+40+330"
      
  - name: exemple bar du coin
    description: Test with bar du coin theme
    command_args:
      - --set IMG1="https://upload.wikimedia.org/wikipedia/commons/thumb/5/5f/Pain_au_chocolat_Luc_Viatour.jpg/1280px-Pain_au_chocolat_Luc_Viatour.jpg"
      - --set IMG1_EFFECTS_AFTER="-colorspace Gray  -dither FloydSteinberg -colors 32 +level-colors '#004466,#4cc4ff' -resize 1200x"
      - --set COMMAND2="-fill '#00aaff' -draw 'rectangle 885,571 900,675'"
      - --set TEXT4="Le"
      - --set TEXT4_FG="#000000"
      - --set TEXT5="bar du coin"
      - --set TEXT5_FG="#000000"
      - --set TEXT6="Pain au chocolat ou chocolatine ?"
      - --set TEXT6_FG="#FFD300"
      - --set TEXT6_FONT_SIZE=72
      - --set TEXT6_GEOMETRY="+40+200"
      - --set TEXT7="Et pour vous, c'est quoi ?"
      - --set TEXT7_FG="#FFFFFF"
      - --set TEXT7_FONT_SIZE=64
      - --set TEXT7_GEOMETRY="+40+380"
      
  - name: exemple barricade
    description: Test with barricade theme
    command_args:
      - --set IMG1="https://www.francebleu.fr/s3/cruiser-production-eu3/2025/08/910a2661-bdf1-4bc5-bb7c-214b50d1d2a3/1200x680_sc_loi-duplomb.jpg"
      - --set IMG1_EFFECTS_AFTER="-colorspace Gray  -dither FloydSteinberg -colors 32 +level-colors '#004466,#ff4c6a' -resize 1200x675"
      - --set COMMAND2="-fill '#ff002a' -draw 'rectangle 885,571 900,675'"
      - --set TEXT4="La"
      - --set TEXT4_FG="#00000066"
      - --set TEXT5="Barricade"
      - --set TEXT5_FG="#00000066"
      - --set TEXT6="Pétition contre la loi Duplomb"
      - --set TEXT6_FG="#FFD300"
      - --set TEXT6_FONT_SIZE=72
      - --set TEXT6_GEOMETRY="+40+200"
      - --set TEXT7="2 millions de signatures et pourtant, elle est passé !"
      - --set TEXT7_FG="#FFFFFF"
      - --set TEXT7_FONT_SIZE=64
      - --set TEXT7_GEOMETRY="+40+380"
