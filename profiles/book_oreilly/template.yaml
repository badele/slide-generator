version: "1"
name: book_oreilly
description: O'Reilly-style book cover — header bar, red title block, illustration, author
output:
  width: 800
  height: 1200
fonts:
  - family: Montserrat
    path: resources/fonts/Montserrat-100.ttf
    weight: 100
  - family: Montserrat
    path: resources/fonts/Montserrat-300.ttf
    weight: 300
  - family: Montserrat
    path: resources/fonts/Montserrat-400.ttf
    weight: 400
  - family: Montserrat
    path: resources/fonts/Montserrat-700.ttf
    weight: 700
  - family: Montserrat
    path: resources/fonts/Montserrat-900.ttf
    weight: 900
palette:
  - "#C0392B"
  - "#000000"
  - "#FFFFFF"
  - "#AAAAAA"
defaults:
  fg: 2
  font:
    name: Montserrat
    size: 22
    weight: 400
params:
  background:
    description: Background color
    default: 3
    type: color
  accent_color:
    description: Accent color (header bar and title block)
    default: 1
    type: color
  publisher:
    description: Publisher label
    default: Aurélie®
    style:
      fg: 3
      font:
        name: Montserrat
        size: 30
        weight: 700
  title:
    description: Book title — one line per line
    required: true
    default: |-
      The
      DevOps
      Profession
    type: textarea
    style:
      fg: 3
      font:
        name: Montserrat
        size: 82
        weight: 700
      split: true
  subtitle:
    description: Subtitle (caps, below title)
    default: |-
      THE ESSENTIAL GUIDE TO AUTOMATION,
      RELIABILITY, AND CONTINUOUS DELIVERY
    type: textarea
    style:
      fg: 3
      font:
        name: Montserrat
        size: 18
        weight: 400
      split: true
  image:
    description: Illustration image URL (animal, etc.)
    default: https://upload.wikimedia.org/wikipedia/commons/c/c2/Logo_Octopus_Foundation.jpg
    type: url
  image_width:
    description: Width px
    default: ""
    type: number
    group: image
  image_height:
    description: Height px
    default: "620"
    type: number
    group: image
  image_x:
    description: X 0-100
    default: "50"
    type: number
    group: image
  image_y:
    description: Y 0-100
    default: "50"
    type: number
    group: image
  author:
    description: Author name
    default: Dupont Lebook
    style:
      fg: 2
      font:
        name: Montserrat
        size: 36
        weight: 400
element:
  type: div
  props:
    style:
      display: flex
      flexDirection: column
      width: 800
      height: 1200
    children:
      - type: background
        props:
          color: "{{ background }}"
          width: 800
          height: 1200
      - type: div
        props:
          style:
            display: flex
            alignItems: center
            backgroundColor: "{{ accent_color }}"
            padding: 14px 24px
          children:
            - type: span
              props:
                param: publisher
                children: "{{ publisher }}"
      - type: div
        props:
          style:
            height: 28
      - type: div
        props:
          style:
            display: flex
            flexDirection: column
            backgroundColor: "{{ accent_color }}"
            padding: 36px 40px 28px 40px
          children:
            - type: lines
              props:
                param: title
                containerStyle:
                  gap: 0
                  marginBottom: 18
                style:
                  lineHeight: 1
                children: "{{ title }}"
            - type: div
              props:
                style:
                  height: 1
                  backgroundColor: "#FFFFFF"
                  opacity: 0.5
                  marginBottom: 14
            - type: lines
              props:
                param: subtitle
                containerStyle:
                  gap: 4
                children: "{{ subtitle }}"
      - type: image
        props:
          src: "{{ image }}"
          imgWidth: "{{ image_width }}"
          imgHeight: "{{ image_height }}"
          x: "{{ image_x }}"
          "y": "{{ image_y }}"
          containerStyle:
            flex: 1
      - type: div
        props:
          style:
            display: flex
            justifyContent: flex-end
            padding: 0 40px 40px 0
          children:
            - type: span
              props:
                param: author
                children: "{{ author }}"
