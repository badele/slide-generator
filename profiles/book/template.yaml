# Illustration image - https://commons.wikimedia.org/wiki/File:Devops-toolchain.svg

version: "1"
name: book
description: Book cover — author, hanging illustration, bold title, publisher
output:
  width: 800
  height: 1200
fonts:
  - family: Montserrat
    path: resources/fonts/Montserrat-100.ttf
    weight: 100
  - family: Montserrat
    path: resources/fonts/Montserrat-300.ttf
    weight: 300
  - family: Montserrat
    path: resources/fonts/Montserrat-400.ttf
    weight: 400
  - family: Montserrat
    path: resources/fonts/Montserrat-700.ttf
    weight: 700
  - family: Montserrat
    path: resources/fonts/Montserrat-900.ttf
    weight: 900
palette:
  - "#f5c211"
  - "#ffffff"
  - "#000000"
  - "#2B2B2B"
defaults:
  fg: 2
  font:
    name: Montserrat
    size: 30
    weight: 400
params:
  background:
    description: Background color
    default: "#f5c211"
    type: color
  bg_image:
    description: Background image URL (optional, overlaid over background color)
    default: ""
    type: url
  author:
    description: Author name(s), use \n for multiple lines
    default: |-
      DUPONT LEBOOK
      DUPOND LELIVRE
    type: textarea
    style:
      fg: 3
      font:
        name: Montserrat
        size: 26
        weight: 400
      split: true
  title:
    description: Title lines — use [FS=N FW=N] for per-line size (e.g. first line smaller)
    required: true
    default: |-
      [FS=44 FW=700]Learn About[/]
      The
      DevOps
      Profession
    type: textarea
    style:
      fg: 3
      font:
        name: Montserrat
        size: 120
        weight: 900
      split: true
  illustration:
    description: Illustration image URL
    default: data:image/png;base64,
    type: url
  illustration_width:
    description: Width px
    default: ""
    type: number
    group: illustration
  illustration_height:
    description: Height px
    default: ""
    type: number
    group: illustration
  illustration_x:
    description: X 0-100
    default: "50"
    type: number
    group: illustration
  illustration_y:
    description: Y 0-100
    default: "50"
    type: number
    group: illustration
  publisher:
    description: Publisher name
    default: The white leaves
    style:
      fg: 3
      font:
        name: Montserrat
        size: 26
        weight: 300
element:
  type: div
  props:
    style:
      display: flex
      position: relative
      width: 800
      height: 1200
    children:
      - type: background
        props:
          color: "{{ background }}"
          src: "{{ bg_image }}"
          width: 800
          height: 1200
      - type: div
        props:
          style:
            display: flex
            flexDirection: column
            position: relative
            width: 800
            height: 1200
            padding: 50px 50px
          children:
            - type: lines
              props:
                param: author
                containerStyle:
                  alignItems: center
                  marginBottom: 24
                style:
                  alignSelf: center
                  textAlign: center
                children: "{{ author }}"
            - type: image
              props:
                src: "{{ illustration }}"
                imgWidth: "{{ illustration_width }}"
                imgHeight: "{{ illustration_height }}"
                x: "{{ illustration_x }}"
                "y": "{{ illustration_y }}"
                containerStyle:
                  marginBottom: 36
            - type: lines
              props:
                param: title
                containerStyle:
                  gap: 0
                children: "{{ title }}"
            - type: div
              props:
                style:
                  flex: 1
            - type: span
              props:
                param: publisher
                style:
                  alignSelf: center
                children: "{{ publisher }}"
