version: "1"
name: clan
description: Clan.lol — dark teal, title + subtitle + description, logo top-right
output:
  width: 1200
  height: 675
fonts:
  - family: BarlowCondensed
    path: resources/fonts/BarlowCondensed-900.ttf
    weight: 900
  - family: BarlowCondensed
    path: resources/fonts/BarlowCondensed-700.ttf
    weight: 700
palette:
  - "#253A3B"
  - "#FFD300"
  - "#FFFFFF"
  - "#2AEB6D"
  - "#253a3b"
defaults:
  fg: 3
  font:
    name: BarlowCondensed
    size: 36
    weight: 700
params:
  background:
    description: Background color
    default: 1
    type: color
  bg_image:
    description: Background visual URL (optional, overlaid faintly)
    default: https://poster.ma-cabane.eu//clan_background.png
    type: url
  logo:
    description: Logo URL (top-right)
    default: data:image/svg+xml;base64,
    type: url
  logo_height:
    description: Logo height (px)
    default: "54"
    type: number
    group: logo
  overlay_color:
    description: Overlay color on top of background image
    default: "#253a3b"
    type: color
  overlay_opacity:
    description: Overlay opacity (0 = transparent, 1 = opaque)
    default: "0.97"
    type: number
    group: overlay_color
  title:
    description: Main title
    required: true
    default: KILL THE CLOUD
    type: textarea
    style:
      fg: 2
      font:
        name: BarlowCondensed
        size: 96
        weight: 900
  subtitle:
    description: Subtitle
    default: BUILD YOUR OWN DARKNET
    style:
      fg: 3
      font:
        name: BarlowCondensed
        size: 52
        weight: 700
  description:
    description: Description text
    default: |-
      DISCOVER THE SIMPLEST WAY TO RE-ENTER INDEPENDENT COMPUTING
      WITH OUR FRAMEWORK. PLACING CONTROL DIRECTLY AT YOUR FINGERTIPS.
    type: textarea
    style:
      fg: 4
      font:
        name: BarlowCondensed
        size: 40
        weight: 700
element:
  type: div
  props:
    style:
      display: flex
      width: 1200
      height: 675
      position: relative
    children:
      - type: background
        props:
          color: "{{ background }}"
          src: "{{ bg_image }}"
          width: 1200
          height: 675
      - type: div
        props:
          style:
            position: absolute
            top: 0
            left: 0
            width: 1200
            height: 675
            backgroundColor: "{{ overlay_color }}"
            opacity: "{{ overlay_opacity }}"
      - type: div
        props:
          style:
            display: flex
            flexDirection: column
            width: 1200
            height: 675
            padding: 20px 58px 58px 58px
          children:
            - type: div
              props:
                style:
                  display: flex
                  justifyContent: flex-end
                  marginBottom: 0
                children:
                  - type: image
                    props:
                      src: "{{ logo }}"
                      imgHeight: "{{ logo_height }}"
            - type: div
              props:
                style:
                  flex: 1
            - type: lines
              props:
                param: title
                style:
                  lineHeight: 1
                containerStyle:
                  marginBottom: 8
                children: "{{ title }}"
            - type: span
              props:
                param: subtitle
                children: "{{ subtitle }}"
            - type: div
              props:
                style:
                  height: 28
            - type: lines
              props:
                param: description
                style:
                  lineHeight: 1.3
                children: "{{ description }}"
